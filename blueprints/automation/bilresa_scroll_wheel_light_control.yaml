blueprint:
  name: "IKEA BILRESA Scroll Wheel – Light Control (Matter)"
  description: >
    Control a light with the IKEA BILRESA scroll-wheel (dimmer) remote via Matter.

    The BILRESA scroll wheel exposes **three** event entities in Home Assistant via
    the Matter integration, all labelled "Button (N)". They come in groups of three;
    you need the most recently active group.

    **Finding the correct entities:**
    1. Go to Settings → Devices & Services → your BILRESA device page.
    2. The device lists multiple "Button (N)" entities. Find the three most recently
       active ones by interacting with the wheel and checking which entities show
       the newest timestamp.
    3. Rotate the wheel clockwise a few steps — note which entity just updated;
       that is your **CW rotation** entity.
    4. Rotate counter-clockwise — that entity is your **CCW rotation** entity.
    5. Press the center button — that entity is your **Center button** entity.
    6. You can also use Developer Tools → States, search for your BILRESA device,
       and watch which entities change as you interact with the wheel.

    | Entity | Event type | Action |
    |---|---|---|
    | CW rotation entity | `multi_press_N` | brightness **up** by N × step % |
    | CCW rotation entity | `multi_press_N` | brightness **down** by N × step % |
    | Center button entity | `multi_press_1` | `light.toggle` |
  domain: automation
  source_url: https://github.com/tactmaster/ha-tools/blob/main/blueprints/automation/bilresa_scroll_wheel_light_control.yaml
  input:
    cw_entity:
      name: Clockwise Rotation Event Entity
      description: >
        The event entity that fires when you rotate the wheel **clockwise**.
        It fires `multi_press_N` where N is the number of steps rotated.
        Find it by rotating CW and checking which Button entity just updated.
      selector:
        entity:
          domain: event

    ccw_entity:
      name: Counter-clockwise Rotation Event Entity
      description: >
        The event entity that fires when you rotate the wheel **counter-clockwise**.
        It fires `multi_press_N` where N is the number of steps rotated.
        Find it by rotating CCW and checking which Button entity just updated.
      selector:
        entity:
          domain: event

    center_entity:
      name: Center Button Event Entity
      description: >
        The event entity that fires when you **press the center button**.
        It fires `multi_press_1` on a single press.
        Find it by pressing the center button and checking which Button entity just updated.
      selector:
        entity:
          domain: event

    light:
      name: Light
      description: The light (or light group) to control.
      selector:
        target:
          entity:
            domain: light

    brightness_step_pct:
      name: Brightness Step (%)
      description: >
        How many percentage points the brightness changes per scroll step
        (default 10 %).  The total change is multiplied by the number of steps
        rotated, so scrolling 3 notches changes brightness by 3 × this value.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input cw_entity
    id: cw
  - platform: state
    entity_id: !input ccw_entity
    id: ccw
  - platform: state
    entity_id: !input center_entity
    id: center

action:
  - variables:
      event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
      # totalNumberOfPressesCounted encodes the number of scroll steps rotated.
      press_count: >
        {{ trigger.to_state.attributes.totalNumberOfPressesCounted | default(1) | int }}
      step: !input brightness_step_pct
      is_press_event: "{{ event_type is match('multi_press_\\d+') }}"

  - choose:
      # ── Center button: press → toggle ─────────────────────────────────────
      - conditions:
          - condition: trigger
            id: center
          - condition: template
            value_template: "{{ is_press_event }}"
        sequence:
          - service: light.toggle
            target: !input light

      # ── CW entity: N steps → brightness UP ────────────────────────────────
      - conditions:
          - condition: trigger
            id: cw
          - condition: template
            value_template: "{{ is_press_event }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ press_count * (step | int) }}"

      # ── CCW entity: N steps → brightness DOWN ─────────────────────────────
      - conditions:
          - condition: trigger
            id: ccw
          - condition: template
            value_template: "{{ is_press_event }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ (press_count * (step | int)) * -1 }}"
