blueprint:
  name: "IKEA BILRESA Scroll Wheel – Light Control (Matter)"
  description: >
    Control a light with the IKEA BILRESA scroll-wheel (dimmer) remote via Matter.

    The BILRESA scroll wheel exposes **two** event entities in Home Assistant:

    1. **Rotation entity** — fires `step_up` / `step_down` as you turn the wheel.
       This is the entity you must select below.
    2. **Button entity** (labelled "Button (1)") — fires `multi_press_1` … `multi_press_8`
       when you physically press/click the wheel.  **Do NOT select this one.**

    To find the correct entity go to Settings → Devices & Services → your BILRESA
    device and open the device page.  Look for the event entity whose **event types**
    list includes `step_up` and `step_down` (not `multi_press_1`/`multi_press_2` etc.).

    Actions handled:

    - **Rotate clockwise** → `step_up` → increase brightness by step
    - **Rotate counter-clockwise** → `step_down` → decrease brightness by step
    - **Press wheel** → `multi_press_1` → toggle light on/off

    > **Note on action code 32768:** In ZHA/Zigbee this corresponds to the
    > Level Control cluster command `step_with_on_off` (0x8000).  Via the
    > Matter integration Home Assistant maps this to the `step_up` event type
    > on the rotation event entity.
  domain: automation
  source_url: https://github.com/tactmaster/ha-tools/blob/main/blueprints/automation/bilresa_scroll_wheel_light_control.yaml
  input:
    wheel_entity:
      name: Scroll Wheel Rotation Event Entity
      description: >
        The **rotation** event entity for the BILRESA scroll wheel (NOT the button
        entity).  The correct entity has event types `step_up` and `step_down` in
        its attributes.  If you see only `multi_press_1`, `multi_press_2`, etc. you
        have selected the button entity — go back and pick the other event entity on
        the device.
      selector:
        entity:
          domain: event

    light:
      name: Light
      description: The light (or light group) to control.
      selector:
        target:
          entity:
            domain: light

    brightness_step_pct:
      name: Brightness Step (%)
      description: >
        How many percentage points the brightness changes per scroll step
        (default 10 %).
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  # Matter button/level events arrive as state-changes on the event entity.
  - platform: state
    entity_id: !input wheel_entity

action:
  - variables:
      # The event_type attribute holds the action name (e.g. "step_up").
      event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
      step: !input brightness_step_pct

  - choose:
      # ── Press wheel → toggle ───────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence:
          - service: light.toggle
            target: !input light

      # ── Rotate clockwise → brightness UP ──────────────────────────────────
      # Matter maps the Level Control "step_with_on_off" command (action code
      # 0x8000 / 32768) to the "step_up" event type in HA.
      - conditions:
          - condition: template
            value_template: "{{ event_type in ['step_up', 'step_with_on_off'] }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ step | int }}"

      # ── Rotate counter-clockwise → brightness DOWN ────────────────────────
      # Matter maps the Level Control "step" (down) command to "step_down".
      - conditions:
          - condition: template
            value_template: "{{ event_type in ['step_down', 'step'] }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ (step | int) * -1 }}"

      # ── move_to_level fallback ─────────────────────────────────────────────
      # Some firmware versions send a discrete level value directly.
      # The level attribute (0–254) is mapped to HA brightness (0–255).
      - conditions:
          - condition: template
            value_template: "{{ event_type in ['move_to_level', 'move_to_level_with_on_off'] }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness: >
                {{ (trigger.to_state.attributes.get('level',
                    trigger.to_state.attributes.get('Level', 0)) | int) }}
