blueprint:
  name: "IKEA BILRESA Scroll Wheel – Light Control (Matter)"
  description: >
    Control a light with the IKEA BILRESA scroll-wheel (dimmer) remote via Matter.

    The BILRESA scroll wheel exposes **two** event entities in Home Assistant via
    the Matter integration — one per rotation direction — both labelled "Button (N)".
    Each entity fires `multi_press_N` events where N is the number of rotation steps.

    Go to Settings → Devices & Services → your BILRESA device to find both event
    entities.  You will need to test which is clockwise and which is counter-clockwise
    by rotating the wheel and checking which entity fires in Developer Tools → Events
    (filter on `state_changed` and watch the `event_type` attribute).

    | Entity | Event type | Action |
    |---|---|---|
    | CW / Button entity | `multi_press_1` | `light.toggle` (center-button press) |
    | CW / Button entity | `multi_press_N` (N > 1) | brightness **up** by N × step % |
    | CCW entity | `multi_press_N` | brightness **down** by N × step % |
  domain: automation
  source_url: https://github.com/tactmaster/ha-tools/blob/main/blueprints/automation/bilresa_scroll_wheel_light_control.yaml
  input:
    cw_entity:
      name: Clockwise / Button Press Event Entity
      description: >
        The event entity for **clockwise** rotation and the **center button press**.
        This entity fires `multi_press_1` for a single button press (toggle) and
        `multi_press_N` (N > 1) for N clockwise scroll steps.
        Typically labelled "Button (1)" on the device page.
      selector:
        entity:
          domain: event

    ccw_entity:
      name: Counter-clockwise Rotation Event Entity
      description: >
        The event entity for **counter-clockwise** rotation.
        This entity fires `multi_press_N` for N counter-clockwise scroll steps.
        Typically labelled "Button (2)" on the device page.
      selector:
        entity:
          domain: event

    light:
      name: Light
      description: The light (or light group) to control.
      selector:
        target:
          entity:
            domain: light

    brightness_step_pct:
      name: Brightness Step (%)
      description: >
        How many percentage points the brightness changes per scroll step
        (default 10 %).  The total change is multiplied by the number of steps
        rotated, so scrolling 3 notches changes brightness by 3 × this value.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input cw_entity
    id: cw
  - platform: state
    entity_id: !input ccw_entity
    id: ccw

action:
  - variables:
      event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
      # totalNumberOfPressesCounted encodes the number of scroll steps rotated.
      press_count: >
        {{ trigger.to_state.attributes.totalNumberOfPressesCounted | default(1) | int }}
      step: !input brightness_step_pct

  - choose:
      # ── CW entity: single press → toggle ──────────────────────────────────
      - conditions:
          - condition: trigger
            id: cw
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence:
          - service: light.toggle
            target: !input light

      # ── CW entity: N > 1 steps → brightness UP ────────────────────────────
      - conditions:
          - condition: trigger
            id: cw
          - condition: template
            value_template: >
              {{ event_type is match('multi_press_\\d+') and press_count > 1 }}
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ press_count * (step | int) }}"

      # ── CCW entity: any multi_press → brightness DOWN ──────────────────────
      - conditions:
          - condition: trigger
            id: ccw
          - condition: template
            value_template: "{{ event_type is match('multi_press_\\d+') }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ (press_count * (step | int)) * -1 }}"

      # ── step_up fallback (older firmware) ─────────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ event_type in ['step_up', 'step_with_on_off'] }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ step | int }}"

      # ── step_down fallback (older firmware) ───────────────────────────────
      - conditions:
          - condition: template
            value_template: "{{ event_type in ['step_down', 'step'] }}"
        sequence:
          - service: light.turn_on
            target: !input light
            data:
              brightness_step_pct: "{{ (step | int) * -1 }}"
